<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in - Setup &amp; Cleanup Info</title>
<style>
body{font-family:'Open Sans',Arial,sans-serif;background:#fbf8e8;margin:0;display:flex;min-height:100vh;align-items:center;justify-content:center}
form{background:#fff;padding:32px;border-radius:8px;box-shadow:0 2px 10px rgba(0,0,0,.2);width:300px}
h1{font-size:20px;margin:0 0 4px}p{margin:0 0 20px;color:#555;font-size:14px}
label{display:block;font-size:14px;margin:12px 0 4px}
input{width:100%;box-sizing:border-box;padding:8px;font-size:16px;border:1px solid #888;border-radius:4px}
button{margin-top:20px;width:100%;padding:10px;font-size:16px;background:#f1c232;border:0;border-radius:4px;cursor:pointer;font-weight:700}
#err{color:#b00020;font-size:14px;margin-top:12px;min-height:18px}
</style></head><body>
<form id="f"><h1>Setup &amp; Cleanup Info</h1><p>Occidental Course - servers only</p>
<label for="u">Username</label><input id="u" autocomplete="username" required autofocus>
<label for="p">Password</label><input id="p" type="password" autocomplete="current-password" required>
<button type="submit">Sign in</button><div id="err" role="alert"></div></form>
<script>
var H='4029c902a2059f38af3f6f53884b76d227243d22b981caa8dcc21a9d65181e40';
async function sha(s){var b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return Array.from(new Uint8Array(b)).map(function(x){return x.toString(16).padStart(2,'0')}).join('')}
document.getElementById('f').addEventListener('submit',async function(e){
  e.preventDefault();
  var h=await sha('occi-setup|'+document.getElementById('u').value+'|'+document.getElementById('p').value);
  if(h!==H){document.getElementById('err').textContent='Incorrect username or password.';return}
  sessionStorage.setItem('occi_auth',h);
  var n=new URLSearchParams(location.search).get('next')||'index.html';
  if(!/^[A-Za-z0-9_\/.-]+\.html$/.test(n)||n.indexOf('..')>=0)n='index.html';
  location.replace(n);
});
</script></body></html>
